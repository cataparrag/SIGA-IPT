spring.application.name=backend

spring.datasource.url=${SIGA_DB_URL:jdbc:postgresql://127.0.0.1:5433/siga}
spring.datasource.username=${SIGA_DB_USER:siga}
spring.datasource.password=${SIGA_DB_PASSWORD:siga}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SIGA_SHOW_SQL:true}

# Keycloak: the backend validates the JWT signature with the realm's public keys (jwk-set-uri)
# and checks that the token was issued by this realm (issuer-uri).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SIGA_JWT_ISSUER_URI:http://localhost:8180/auth/realms/siga-ipt}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SIGA_JWK_SET_URI:http://localhost:8180/auth/realms/siga-ipt/protocol/openid-connect/certs}

# Load the Appendix A data when the database is empty (only one replica does it in production).
siga.seed-data=${SIGA_SEED_DATA:true}
