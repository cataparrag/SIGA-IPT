# Production deployment of SIGA IPT. Run from this folder:
#   docker compose -f docker-compose.prod.yml up -d
# Configuration and passwords come from the .env file next to this one (never commit it).
name: siga-prod

x-backend-env: &backend-env
  SIGA_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  SIGA_DB_USER: ${POSTGRES_USER}
  SIGA_DB_PASSWORD: ${POSTGRES_PASSWORD}
  SIGA_JWT_ISSUER_URI: ${SIGA_PUBLIC_URL}/auth/realms/siga-ipt
  SIGA_JWK_SET_URI: http://keycloak:8080/auth/realms/siga-ipt/protocol/openid-connect/certs
  SIGA_SHOW_SQL: "false"
  SIGA_SEED_DATA: "false"
  JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m

x-backend: &backend
  image: ${DOCKERHUB_USER}/siga-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on:
    - postgres
    - keycloak
  networks:
    - siga-net

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - siga-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      SIGA_PUBLIC_URL: ${SIGA_PUBLIC_URL}
    volumes:
      - ../keycloak/siga-ipt-realm.json:/opt/keycloak/data/import/siga-ipt-realm.json:ro
      - ../keycloak/themes/siga:/opt/keycloak/themes/siga:ro
    networks:
      - siga-net

  # Three replicas of the same backend image. Only the first loads the initial data.
  backend-1:
    <<: *backend
    environment:
      <<: *backend-env
      SIGA_SEED_DATA: "true"

  backend-2:
    <<: *backend
    environment: *backend-env

  backend-3:
    <<: *backend
    environment: *backend-env

  frontend:
    image: ${DOCKERHUB_USER}/siga-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - siga-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - frontend
      - keycloak
    networks:
      - siga-net

networks:
  siga-net:

volumes:
  pgdata:
