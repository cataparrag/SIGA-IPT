# Entry point of SIGA IPT in production (port 80).
#   /api/   -> load balancer between the 3 backend replicas (round robin)
#   /auth/  -> Keycloak
#   /       -> frontend (React)

upstream siga_backend {
    server backend-1:8080;
    server backend-2:8080;
    server backend-3:8080;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://siga_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Shows which replica answered each request (useful to demonstrate the load balancing).
        add_header X-Upstream $upstream_addr always;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Keycloak sends large headers (tokens, cookies).
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
